# Agent Dead Drop —— 一键编排（app + cloudflared 隧道）
#
# 用法（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 需要的文件（都在仓库根目录，已被 .gitignore 忽略，需手动拷到服务器）：
#   .env                        # 环境变量（含 ADMIN_TOKEN / TOTP / 公网地址）
#   data/messages.db            # 数据库
#   data/*.mmdb                 # GeoIP 库（可选）
#   data/cloudflared-token.txt  # 隧道连接令牌（复用家用的同一个隧道）
#
# 设计要点：
#   - app 不发布端口，公网只能经 cloudflared 进入（源站不暴露）。
#   - tunnel 与 app 共享网络命名空间，所以隧道里写的 http://localhost:8000 直接可达。
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # 容器内时区
      TZ: Asia/Shanghai
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    network_mode: "service:app"
    depends_on:
      - app
