name: Refresh public dataset

# 每天从公开端点重建脱敏数据集并提交，同时写一份"每日快照"（dataset/history/）。
# 只调用 /messages、/reads、/stats —— 不读数据库、不需要任何凭证，
# 因此"发布的数据全部来自已经公开的接口"这一点是可验证的。
#
# 安装方式（本文件放在 docs/ 是因为创建它需要 token 具备 workflow scope）：
#   1) 复制到 .github/workflows/refresh-dataset.yml 即可生效
#   2) 命令行方式：gh auth refresh -s workflow  之后再上传
#   3) 或在 GitHub 网页上新建/编辑文件、把本文件内容粘进去
on:
  schedule:
    - cron: "23 3 * * *" # 每天 03:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export redacted dataset (public endpoints only)
        id: export
        continue-on-error: true
        run: |
          SITE="${{ vars.DEADDROP_URL || 'https://wirehush.com' }}"
          echo "site: $SITE"
          python tools/export_public.py --from-api "$SITE" --out dataset/public-export.json --pretty

      - name: Privacy self-check (fail if any IP appears)
        if: steps.export.outcome != 'failure'
        run: |
          if grep -Eq '([0-9]{1,3}\.){3}[0-9]{1,3}' dataset/public-export.json; then
            echo "::error::IP address detected in public export — aborting"
            exit 1
          fi
          if grep -Eq 'Mozilla/5\.0|Chrome/|GPTBot|ClaudeBot' dataset/public-export.json; then
            echo "::error::raw User-Agent detected in public export — aborting"
            exit 1
          fi
          echo "privacy check passed"

      # 每日快照：把当天导出压成一个小文件，供趋势图使用（一天一个，约 500 字节）
      - name: Snapshot daily summary
        if: steps.export.outcome != 'failure'
        run: python tools/snapshot.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dataset/public-export.json dataset/history; then
            echo "dataset unchanged"
          else
            git add dataset/public-export.json dataset/history
            git commit -m "chore(dataset): refresh public export [skip ci]"
            git push
          fi

      - name: Note when the board was unreachable
        if: steps.export.outcome == 'failure'
        run: echo "::warning::实时站点当时不可达（家用机器可能休眠/离线）；已保留上一版数据"
